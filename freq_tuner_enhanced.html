<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F.R.E.Q. - Harmonic Systems (WebGL Enhanced)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100;300;400;600&family=Syncopate:wght@700&display=swap');
        
        :root {
            --sensual-red: #ff2d55;
            --sensual-purple: #a855f7;
            --sensual-gold: #fbbf24;
            --bg-deep: #050108;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-deep);
            color: #fff;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: background 1s ease;
        }

        .vector-bg {
            position: fixed;
            inset: 0;
            z-index: -1;
            opacity: 0.15;
            pointer-events: none;
        }

        /* BRAND PROTECTION: DO NOT CHANGE */
        .freq-logo-tl {
            font-family: 'Syncopate', sans-serif;
            letter-spacing: 0.2em;
            background: linear-gradient(to right, #34d399, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 10px rgba(52, 211, 153, 0.3));
        }

        .glass-panel {
            background: rgba(15, 5, 20, 0.7);
            backdrop-filter: blur(40px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 100px rgba(0,0,0,0.9), 0 0 40px rgba(168, 85, 247, 0.1);
            transform: translateZ(0);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Sensual Glows */
        .sensual-glow {
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 45, 85, 0.15) 0%, transparent 70%);
            filter: blur(60px);
            pointer-events: none;
            z-index: -1;
            animation: pulse-glow 8s infinite alternate;
        }

        @keyframes pulse-glow {
            0% { transform: scale(1) translate(-10%, -10%); opacity: 0.5; }
            100% { transform: scale(1.5) translate(10%, 10%); opacity: 0.8; }
        }

        #tuner-container {
            width: 100%;
            height: 280px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            border-radius: 2rem;
            overflow: hidden;
            background: rgba(0,0,0,0.3);
        }

        canvas {
            max-width: 100%;
            height: auto;
            display: block;
        }

        .mode-btn {
            font-size: 9px;
            letter-spacing: 0.2em;
            padding: 8px 16px;
            border-radius: 99px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.05);
            color: rgba(255,255,255,0.4);
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .mode-btn.active {
            background: rgba(168, 85, 247, 0.2);
            border-color: rgba(168, 85, 247, 0.5);
            color: #fff;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.3);
        }

        #note-display {
            font-weight: 100;
            text-shadow: 0 0 30px rgba(255,255,255,0.2);
            transition: all 0.3s ease;
        }

        .scan-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: linear-gradient(to bottom, transparent 50%, rgba(255, 45, 85, 0.02) 50%);
            background-size: 100% 4px;
        }

        .interactive-play-text {
            position: absolute;
            bottom: 20px;
            font-size: 10px;
            letter-spacing: 0.5em;
            color: rgba(255, 255, 255, 0.1);
            text-transform: uppercase;
            animation: breathe 4s infinite ease-in-out;
        }

        @keyframes breathe {
            0%, 100% { opacity: 0.1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(1.05); }
        }
    </style>
</head>
<body>

    <div class="sensual-glow" style="top: 10%; left: 10%;"></div>
    <div class="sensual-glow" style="bottom: 10%; right: 10%; background: radial-gradient(circle, rgba(168, 85, 247, 0.15) 0%, transparent 70%);"></div>

    <svg class="vector-bg" width="100%" height="100%">
        <defs>
            <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
                <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(168, 85, 247, 0.1)" stroke-width="0.5"/>
            </pattern>
        </defs>
        <rect width="100%" height="100%" fill="url(#grid)" />
    </svg>

    <!-- BRAND LOGO: PROTECTED -->
    <div class="fixed top-8 left-8 flex items-center gap-3 group cursor-pointer select-none">
        <div class="relative w-12 h-12">
            <div class="absolute inset-0 bg-emerald-500/20 rounded-full blur-xl group-hover:bg-purple-500/30 transition-colors duration-700"></div>
            <svg viewBox="0 0 100 100" class="w-full h-full relative z-10 drop-shadow-[0_0_8px_rgba(52,211,153,0.5)]">
                <defs>
                    <filter id="xorvium-glitch" x="-20%" y="-20%" width="140%" height="140%">
                        <feTurbulence type="fractalNoise" baseFrequency="0.01 0.1" numOctaves="2" result="noise">
                            <animate attributeName="baseFrequency" values="0.01 0.1; 0.05 0.5; 0.01 0.1" dur="2s" repeatCount="indefinite" />
                        </feTurbulence>
                        <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" />
                    </filter>
                    <linearGradient id="freq-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#34d399" />
                        <stop offset="100%" stop-color="#a855f7" />
                    </linearGradient>
                </defs>
                <g transform="translate(25, 35)" style="filter: url(#xorvium-glitch)">
                    <rect x="0" y="10" width="6" height="10" rx="3" fill="url(#freq-grad)">
                        <animate attributeName="height" values="10; 30; 15; 25; 10" dur="0.8s" repeatCount="indefinite" />
                        <animate attributeName="y" values="10; 0; 7.5; 2.5; 10" dur="0.8s" repeatCount="indefinite" />
                    </rect>
                    <rect x="10" y="10" width="6" height="10" rx="3" fill="url(#freq-grad)">
                        <animate attributeName="height" values="10; 30; 15; 25; 10" dur="0.9s" begin="0.1s" repeatCount="indefinite" />
                        <animate attributeName="y" values="10; 0; 7.5; 2.5; 10" dur="0.9s" begin="0.1s" repeatCount="indefinite" />
                    </rect>
                    <rect x="20" y="10" width="6" height="10" rx="3" fill="url(#freq-grad)">
                        <animate attributeName="height" values="10; 30; 15; 25; 10" dur="1.0s" begin="0.2s" repeatCount="indefinite" />
                        <animate attributeName="y" values="10; 0; 7.5; 2.5; 10" dur="1.0s" begin="0.2s" repeatCount="indefinite" />
                    </rect>
                    <rect x="30" y="10" width="6" height="10" rx="3" fill="url(#freq-grad)">
                        <animate attributeName="height" values="10; 30; 15; 25; 10" dur="1.1s" begin="0.3s" repeatCount="indefinite" />
                        <animate attributeName="y" values="10; 0; 7.5; 2.5; 10" dur="1.1s" begin="0.3s" repeatCount="indefinite" />
                    </rect>
                    <rect x="40" y="10" width="6" height="10" rx="3" fill="url(#freq-grad)">
                        <animate attributeName="height" values="10; 30; 15; 25; 10" dur="1.2s" begin="0.4s" repeatCount="indefinite" />
                        <animate attributeName="y" values="10; 0; 7.5; 2.5; 10" dur="1.2s" begin="0.4s" repeatCount="indefinite" />
                    </rect>
                </g>
            </svg>
        </div>
        <div class="flex flex-col -space-y-1">
            <span class="freq-logo-tl text-2xl font-black">F.R.E.Q.</span>
            <span class="text-[8px] tracking-[0.4em] text-white/30 uppercase pl-1">Harmonic Systems</span>
        </div>
    </div>

    <div class="max-w-xl w-full p-12 rounded-[4rem] glass-panel flex flex-col items-center relative overflow-hidden">
        <div class="scan-overlay"></div>
        
        <div class="flex gap-4 mb-8 flex-wrap justify-center">
            <button class="mode-btn active" data-mode="needle">Speedometer</button>
            <button class="mode-btn" data-mode="spectrogram">Spectrogram</button>
            <button class="mode-btn" data-mode="equalizer">Equalizer</button>
            <button class="mode-btn" data-mode="psychedelic">Psychedelic</button>
        </div>

        <div id="note-display" class="text-[10rem] font-thin tracking-tighter mb-2 text-white/90">-</div>
        <div id="freq-val" class="font-mono text-[11px] tracking-[0.6em] text-white/20 mb-6 uppercase">Awaiting Vibration</div>

        <div id="tuner-container">
            <canvas id="tuner-canvas" width="600" height="400"></canvas>
        </div>

        <div class="interactive-play-text">Romantic & Sexy Interactive Play</div>

        <button id="pwr-btn" class="mt-10 group px-16 py-5 rounded-full border border-white/5 bg-white/5 hover:bg-pink-500/10 transition-all active:scale-95">
            <span class="text-[10px] tracking-[0.8em] font-bold text-white/40 group-hover:text-pink-400">INITIATE SENSORS</span>
        </button>
    </div>

    <script>
        const noteStrings = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
        let audioCtx, analyser, isRunning = false;
        const A4 = 432;
        let currentMode = 'needle';
        const PHI = (1 + Math.sqrt(5)) / 2; // Golden Ratio

        const canvas = document.getElementById('tuner-canvas');
        const ctx = canvas.getContext('2d');
        const noteDisplay = document.getElementById('note-display');
        const freqLabel = document.getElementById('freq-val');

        let targetRotation = 0;
        let currentRotation = 0;
        let targetFreq = 0;
        let currentFreq = 0;
        let centsLerp = 0;
        let amplitude = 0;

        // WebGL Context for Psychedelic
        let glCanvas = null;
        let gl = null;
        let glProgram = null;
        let glTime = 0;

        // Spectrogram buffer
        const specCanvas = document.createElement('canvas');
        specCanvas.width = 600;
        specCanvas.height = 400;
        const specCtx = specCanvas.getContext('2d');

        // Mode Switching
        document.querySelectorAll('.mode-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentMode = btn.dataset.mode;
                
                if (currentMode === 'psychedelic' && !gl) {
                    initWebGL();
                }
            });
        });

        document.getElementById('pwr-btn').addEventListener('click', async () => {
            if (isRunning) return location.reload();
            
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const source = audioCtx.createMediaStreamSource(stream);
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 4096;
                analyser.smoothingTimeConstant = 0.8; 
                source.connect(analyser);
                
                isRunning = true;
                document.getElementById('pwr-btn').querySelector('span').innerText = "POWER OFF";
                requestAnimationFrame(renderLoop);
            } catch (e) {
                freqLabel.innerText = "SENSOR ERROR";
            }
        });

        function initWebGL() {
            glCanvas = document.createElement('canvas');
            glCanvas.width = canvas.width;
            glCanvas.height = canvas.height;
            gl = glCanvas.getContext('webgl2', { antialias: true, alpha: true });
            
            if (!gl) {
                console.warn('WebGL2 not supported, falling back to WebGL');
                gl = glCanvas.getContext('webgl', { antialias: true, alpha: true });
            }

            const vertexShader = `
                precision highp float;
                attribute vec2 position;
                void main() {
                    gl_Position = vec4(position, 0.0, 1.0);
                }
            `;

            const fragmentShader = `
                precision highp float;
                uniform float time;
                uniform float amplitude;
                uniform vec2 resolution;
                
                const float PHI = 1.618033988749895;
                const float TAU = 6.283185307179586;
                
                float goldenRatio(vec2 p) {
                    float angle = atan(p.y, p.x);
                    float radius = length(p);
                    float spiral = angle + radius / PHI;
                    return sin(spiral * 0.5) * 0.5 + 0.5;
                }
                
                float mushroom(vec2 p, float scale) {
                    float dist = length(p);
                    float angle = atan(p.y, p.x);
                    float mushroom = sin(dist * scale - time * 2.0) * cos(angle * 3.0);
                    return mushroom * 0.5 + 0.5;
                }
                
                vec3 goldenColor(float t) {
                    float h = mod(t + time * 0.3, 1.0);
                    float s = 0.8 + amplitude * 0.2;
                    float l = 0.5 + sin(time * 0.5) * 0.2;
                    
                    vec3 rgb;
                    if (h < 0.166) {
                        rgb = mix(vec3(1.0, 0.0, 0.0), vec3(1.0, 1.0, 0.0), h * 6.0);
                    } else if (h < 0.333) {
                        rgb = mix(vec3(1.0, 1.0, 0.0), vec3(0.0, 1.0, 0.0), (h - 0.166) * 6.0);
                    } else if (h < 0.5) {
                        rgb = mix(vec3(0.0, 1.0, 0.0), vec3(0.0, 1.0, 1.0), (h - 0.333) * 6.0);
                    } else if (h < 0.666) {
                        rgb = mix(vec3(0.0, 1.0, 1.0), vec3(0.0, 0.0, 1.0), (h - 0.5) * 6.0);
                    } else if (h < 0.833) {
                        rgb = mix(vec3(0.0, 0.0, 1.0), vec3(1.0, 0.0, 1.0), (h - 0.666) * 6.0);
                    } else {
                        rgb = mix(vec3(1.0, 0.0, 1.0), vec3(1.0, 0.0, 0.0), (h - 0.833) * 6.0);
                    }
                    
                    return rgb * l;
                }
                
                void main() {
                    vec2 uv = gl_FragCoord.xy / resolution;
                    vec2 p = (uv - 0.5) * 2.0;
                    p.x *= resolution.x / resolution.y;
                    
                    // Infinite zoom effect
                    float zoom = 1.0 + sin(time * 0.5) * 0.3;
                    p *= zoom;
                    
                    // Rotate based on golden ratio
                    float angle = time * 0.3 + length(p) * PHI;
                    float c = cos(angle);
                    float s = sin(angle);
                    p = vec2(p.x * c - p.y * s, p.x * s + p.y * c);
                    
                    // Layer multiple golden spirals
                    float layer1 = goldenRatio(p);
                    float layer2 = goldenRatio(p * PHI);
                    float layer3 = goldenRatio(p / PHI);
                    
                    // Mushroom effect
                    float mushVal = mushroom(p, 3.0 + amplitude * 5.0);
                    
                    // Combine layers
                    float val = layer1 * 0.4 + layer2 * 0.3 + layer3 * 0.2 + mushVal * 0.1;
                    val = smoothstep(0.2, 0.8, val);
                    
                    // Radial glow
                    float glow = 1.0 / (1.0 + length(p) * 2.0);
                    val += glow * 0.3;
                    
                    // Golden color mapping
                    vec3 col = goldenColor(val);
                    
                    // Add sensual pulsing
                    col *= 0.8 + amplitude * 0.4 + sin(time) * 0.2;
                    
                    gl_FragColor = vec4(col, val * 0.9);
                }
            `;

            glProgram = createProgram(gl, vertexShader, fragmentShader);
            gl.useProgram(glProgram);

            const positionBuffer = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
            gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
                -1, -1, 1, -1, -1, 1, 1, 1
            ]), gl.STATIC_DRAW);

            const positionLocation = gl.getAttribLocation(glProgram, 'position');
            gl.enableVertexAttribArray(positionLocation);
            gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);
        }

        function createProgram(gl, vertexSource, fragmentSource) {
            const vertex = gl.createShader(gl.VERTEX_SHADER);
            gl.shaderSource(vertex, vertexSource);
            gl.compileShader(vertex);

            const fragment = gl.createShader(gl.FRAGMENT_SHADER);
            gl.shaderSource(fragment, fragmentSource);
            gl.compileShader(fragment);

            const program = gl.createProgram();
            gl.attachShader(program, vertex);
            gl.attachShader(program, fragment);
            gl.linkProgram(program);

            if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
                console.error('Program link error:', gl.getProgramInfoLog(program));
            }

            return program;
        }

        function renderLoop() {
            if (!isRunning) return;

            const buffer = new Float32Array(analyser.fftSize);
            analyser.getFloatTimeDomainData(buffer);
            const freq = autoCorrelate(buffer, audioCtx.sampleRate);

            // Calculate RMS for amplitude
            let sum = 0;
            for(let i=0; i<buffer.length; i++) sum += buffer[i]*buffer[i];
            amplitude = Math.sqrt(sum/buffer.length);

            if (freq > -1 && freq < 2000) {
                targetFreq = freq;
                const h = Math.round(12 * (Math.log(freq / A4) / Math.log(2)));
                const noteIndex = ((h + 57) % 12 + 12) % 12;
                const note = noteStrings[noteIndex];
                
                if (note) {
                    const noteFreq = A4 * Math.pow(2, h / 12);
                    const cents = 1200 * (Math.log(freq / noteFreq) / Math.log(2));
                    
                    noteDisplay.innerText = note;
                    centsLerp += (cents - centsLerp) * 0.15;
                    targetRotation = centsLerp * 0.9;
                    
                    updateVisuals(note, Math.abs(cents) < 5);
                }
            } else {
                targetRotation += (0 - targetRotation) * 0.1;
            }
            
            currentRotation += (targetRotation - currentRotation) * 0.15;
            currentFreq += (targetFreq - currentFreq) * 0.15;

            if (currentFreq > 10) freqLabel.innerText = currentFreq.toFixed(1) + " HZ";

            draw();
            glTime += 0.016;
            requestAnimationFrame(renderLoop);
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            if (currentMode === 'needle') {
                drawNeedle();
            } else if (currentMode === 'spectrogram') {
                drawSpectrogram();
            } else if (currentMode === 'equalizer') {
                drawEqualizer();
            } else if (currentMode === 'psychedelic') {
                drawPsychedelic();
            }
        }

        function drawNeedle() {
            const centerX = canvas.width / 2;
            const centerY = canvas.height * 0.8;
            const radius = 180;

            // Arc
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, Math.PI, 0);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Ticks
            for (let i = -50; i <= 50; i += 10) {
                const angle = (i * 1.8 - 90) * (Math.PI / 180);
                const x1 = centerX + Math.cos(angle) * (radius - 10);
                const y1 = centerY + Math.sin(angle) * (radius - 10);
                const x2 = centerX + Math.cos(angle) * radius;
                const y2 = centerY + Math.sin(angle) * radius;
                
                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.strokeStyle = i === 0 ? '#ff2d55' : 'rgba(255,255,255,0.3)';
                ctx.lineWidth = i === 0 ? 2 : 1;
                ctx.stroke();
            }

            // Needle
            const needleAngle = (currentRotation - 90) * (Math.PI / 180);
            const nx = centerX + Math.cos(needleAngle) * (radius - 20);
            const ny = centerY + Math.sin(needleAngle) * (radius - 20);

            ctx.beginPath();
            ctx.moveTo(centerX, centerY);
            ctx.lineTo(nx, ny);
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 3;
            ctx.lineCap = 'round';
            ctx.shadowBlur = 15;
            ctx.shadowColor = 'rgba(255, 45, 85, 0.5)';
            ctx.stroke();
            ctx.shadowBlur = 0;

            // Center point
            ctx.beginPath();
            ctx.arc(centerX, centerY, 8, 0, Math.PI * 2);
            ctx.fillStyle = '#fff';
            ctx.fill();
        }

        function drawSpectrogram() {
            const dataArray = new Uint8Array(analyser.frequencyBinCount);
            analyser.getByteFrequencyData(dataArray);
            
            // Shift existing image
            specCtx.drawImage(specCanvas, -2, 0);
            
            // Draw new column
            for (let i = 0; i < 200; i++) {
                const val = dataArray[i];
                const hue = (i / 200) * 360;
                specCtx.fillStyle = `hsla(${hue}, 80%, ${val / 3}%, ${val / 255})`;
                specCtx.fillRect(specCanvas.width - 2, specCanvas.height - (i * 2), 2, 2);
            }
            
            ctx.drawImage(specCanvas, 0, 0);
        }

        function drawEqualizer() {
            const dataArray = new Uint8Array(analyser.frequencyBinCount);
            analyser.getByteFrequencyData(dataArray);
            const barWidth = (canvas.width / 60);
            
            for (let i = 0; i < 60; i++) {
                const barHeight = (dataArray[i] / 255) * canvas.height * 0.8;
                const x = i * (barWidth + 2);
                
                const grad = ctx.createLinearGradient(0, canvas.height, 0, canvas.height - barHeight);
                grad.addColorStop(0, '#a855f7');
                grad.addColorStop(1, '#ff2d55');
                
                ctx.fillStyle = grad;
                ctx.fillRect(x, canvas.height - barHeight, barWidth, barHeight);
                
                // Reflection
                ctx.fillStyle = 'rgba(255, 45, 85, 0.1)';
                ctx.fillRect(x, canvas.height - barHeight - 10, barWidth, 2);
            }
        }

        function drawPsychedelic() {
            if (!gl) {
                initWebGL();
            }

            // Update uniforms
            const timeLocation = gl.getUniformLocation(glProgram, 'time');
            const amplitudeLocation = gl.getUniformLocation(glProgram, 'amplitude');
            const resolutionLocation = gl.getUniformLocation(glProgram, 'resolution');

            gl.uniform1f(timeLocation, glTime);
            gl.uniform1f(amplitudeLocation, amplitude);
            gl.uniform2f(resolutionLocation, glCanvas.width, glCanvas.height);

            gl.viewport(0, 0, glCanvas.width, glCanvas.height);
            gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

            // Copy WebGL canvas to main canvas
            ctx.drawImage(glCanvas, 0, 0);
        }

        function updateVisuals(note, inTune) {
            if (inTune) {
                noteDisplay.style.color = "#ff2d55";
                noteDisplay.style.filter = "drop-shadow(0 0 30px rgba(255, 45, 85, 0.6))";
                document.body.style.background = "#1a050d";
            } else {
                noteDisplay.style.color = "rgba(255,255,255,0.9)";
                noteDisplay.style.filter = "none";
                document.body.style.background = "#050108";
            }
        }

        function autoCorrelate(buf, sampleRate) {
            let SIZE = buf.length;
            let rms = 0;
            for (let i=0; i<SIZE; i++) { let val = buf[i]; rms += val*val; }
            if (Math.sqrt(rms/SIZE) < 0.01) return -1;
            let r1=0, r2=SIZE-1, thres=0.2;
            for (let i=0; i<SIZE/2; i++) if (Math.abs(buf[i])<thres) { r1=i; break; }
            for (let i=1; i<SIZE/2; i++) if (Math.abs(buf[SIZE-i])<thres) { r2=SIZE-i; break; }
            buf = buf.slice(r1,r2);
            SIZE = buf.length;
            let c = new Array(SIZE).fill(0);
            for (let i=0; i<SIZE; i++) for (let j=0; j<SIZE-i; j++) c[i] = c[i] + buf[j]*buf[j+i];
            let d=0; while (c[d]>c[d+1]) d++;
            let maxval=-1, maxpos=-1;
            for (let i=d; i<SIZE; i++) if (c[i]>maxval) { maxval=c[i]; maxpos=i; }
            let T0 = maxpos;
            let x1=c[T0-1], x2=c[T0], x3=c[T0+1];
            let a = (x1 + x3 - 2*x2)/2, b = (x3 - x1)/2;
            if (a) T0 = T0 - b/(2*a);
            return sampleRate/T0;
        }
    </script>
